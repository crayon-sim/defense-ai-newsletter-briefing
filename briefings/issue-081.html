<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>국방 AI 주간 동향 브리핑 제81호</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: mobile-first single scrolling brief — sticky header with group tabs, collapsible article cards, vertical archive timeline */
:root {
  --bg: #F4F6FA; --panel: #FFFFFF; --panel2: #E9EFF8; --fg: #18202F; --muted: #5B687C;
  --navy: #14213D; --navy2: #1F3864; --head: #1F3864; --steel: #3F66A0; --steel2: #8FA3C7; --gold: #C9A227; --gold-ink: #14213D;
  --line: #D5DCE8; --on-navy: #FFFFFF; --on-navy-muted: #CFDAEE; --shadow: rgba(20, 33, 61, .12);
  --sans: 'Noto Sans KR', 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --hh: 104px;
  --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0C1220; --panel: #151F38; --panel2: #1C2947; --fg: #E9EDF5; --muted: #9BA8BF;
  --navy: #111B33; --navy2: #27447A; --head: #C9D8F5; --steel: #8AA9DE; --steel2: #4F6896; --gold: #DDBB50; --gold-ink: #14213D;
  --line: #28385A; --on-navy: #F5F7FB; --on-navy-muted: #B9C6E0; --shadow: rgba(0, 0, 0, .4); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0C1220; --panel: #151F38; --panel2: #1C2947; --fg: #E9EDF5; --muted: #9BA8BF;
  --navy: #111B33; --navy2: #27447A; --head: #C9D8F5; --steel: #8AA9DE; --steel2: #4F6896; --gold: #DDBB50; --gold-ink: #14213D;
  --line: #28385A; --on-navy: #F5F7FB; --on-navy-muted: #B9C6E0; --shadow: rgba(0, 0, 0, .4); color-scheme: dark; }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.6;
  word-break: keep-all; overflow-wrap: anywhere; }
h1, h2, h3, h4, p, ul, ol { margin: 0; }
h1, h2, h3 { line-height: 1.3; text-wrap: balance; }
ul, ol { padding: 0; list-style: none; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: var(--gl); padding-right: var(--gr); }

/* ---------- sticky header ---------- */
.top { position: sticky; top: 0; z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top, 0px); box-shadow: 0 2px 10px var(--shadow); }
.top .row { display: flex; align-items: center; gap: 10px; padding-block: 8px; }
.top .no { flex: none; width: 34px; height: 34px; border-radius: 6px; background: var(--gold); color: var(--gold-ink);
  font-weight: 900; font-size: 15px; display: grid; place-items: center; }
.top .ttl { flex: 1; min-width: 0; font-weight: 700; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .ttl small { display: block; font-weight: 400; font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.btn { flex: none; min-height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); font-size: 13px; font-weight: 500; }
.btn:hover { border-color: var(--steel); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-block: 0 8px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid var(--line); background: var(--bg);
  font-size: 13px; white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.chip b { color: var(--steel); }
.chip.on { background: var(--navy2); border-color: var(--navy2); color: var(--on-navy); }
.chip.on b { color: var(--gold); }
.prog { height: 3px; background: var(--line); }
.prog i { display: block; height: 100%; width: 0; background: var(--gold); }

/* ---------- hero ---------- */
.hero { background: var(--navy); color: var(--on-navy); padding-block: 36px 32px; }
.hero .no { width: 64px; height: 64px; border-radius: 8px; background: var(--gold); color: var(--gold-ink); font-weight: 900; font-size: 26px; display: grid; place-items: center; margin-bottom: 16px; }
.hero h1 { font-size: clamp(28px, 6vw, 48px); font-weight: 900; letter-spacing: -.01em; margin-bottom: 12px; }
.hero p { color: var(--on-navy-muted); font-size: clamp(14px, 2.2vw, 17px); }
.hero .sm { font-size: 13px; margin-top: 10px; }
.hero .arch { margin-top: 18px; font-family: var(--mono); font-size: 12px; color: var(--steel2); }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.hero .wrap > * { animation: rise .6s ease both; }
.hero .wrap > :nth-child(2) { animation-delay: .08s; } .hero .wrap > :nth-child(3) { animation-delay: .16s; }
.hero .wrap > :nth-child(4) { animation-delay: .24s; } .hero .wrap > :nth-child(5) { animation-delay: .32s; }

/* ---------- sections ---------- */
section.blk { padding-block: 28px 8px; scroll-margin-top: var(--hh); }
.h2 { font-size: clamp(20px, 4vw, 26px); font-weight: 800; color: var(--head); margin-bottom: 14px; }
.sub { font-size: 14px; font-weight: 700; color: var(--head); margin: 20px 0 10px; }
.bluf { background: var(--navy); color: var(--on-navy); border-radius: 12px; padding: 16px 18px; }
.bluf .lab { color: var(--gold); font-weight: 700; font-size: 12.5px; letter-spacing: .08em; margin-bottom: 8px; }
.bluf li { position: relative; padding-left: 16px; margin-bottom: 10px; font-size: 14.5px; }
.bluf li:last-child { margin-bottom: 0; }
.bluf li::before { content: ""; position: absolute; left: 2px; top: .68em; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
.gcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; margin-top: 14px; }
.gcard { display: block; text-decoration: none; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; transition: transform .2s ease, box-shadow .2s ease; }
.gcard:hover { transform: translateY(-2px); box-shadow: 0 8px 20px var(--shadow); }
.gcard .hd { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 15.5px; color: var(--head); margin-bottom: 6px; }
.badge { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--navy2); color: #fff; font-weight: 700; font-size: 13px; display: inline-grid; place-items: center; }
.gcard .msg { font-size: 13.5px; margin-bottom: 8px; }
.gcard .cnt { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.gcard .it { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.gcard .n { font-style: normal; font-family: var(--mono); font-size: 10.5px; min-width: 1.7em; height: 1.7em; padding: 0 3px; border: 1px solid var(--steel2); border-radius: 999px; display: inline-grid; place-items: center; color: var(--steel); font-variant-numeric: tabular-nums; }
.recs { display: grid; gap: 8px; }
.rec { display: flex; gap: 10px; align-items: flex-start; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; }
.rec b { color: var(--head); display: block; font-size: 14px; }

/* ---------- group band ---------- */
.band { background: var(--navy2); color: var(--on-navy); border-radius: 12px; padding: 18px; margin-bottom: 14px; }
.band .k { font-family: var(--mono); font-size: 12px; color: var(--gold); letter-spacing: .08em; }
.band h2 { font-size: clamp(19px, 4vw, 26px); font-weight: 800; margin: 4px 0 6px; }
.band p { color: var(--on-navy-muted); font-size: 14px; }

/* ---------- article card ---------- */
.art { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; scroll-margin-top: var(--hh); }
.art-h { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 10px; }
.num { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--gold); color: var(--gold-ink); font-weight: 800; font-size: 15px; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.num.sm { font-size: 12.5px; }
.art-h h3 { font-size: clamp(16.5px, 2.6vw, 20px); font-weight: 800; color: var(--head); }
.meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
.meta b { color: var(--steel); font-weight: 500; }
.one { background: var(--navy); color: var(--on-navy); border-radius: 10px; padding: 12px 14px; font-weight: 500; font-size: 14.5px; }
.more { width: 100%; min-height: 42px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  background: var(--panel2); border: 0; border-radius: 8px; padding: 0 14px; font-size: 13.5px; font-weight: 500; color: var(--head); }
.more .chev { transition: transform .25s ease; }
.more[aria-expanded="true"] .chev { transform: rotate(180deg); }
.detail { display: grid; gap: 16px; margin-top: 14px; grid-template-columns: minmax(0, 1fr); }
.detail > * { min-width: 0; }
@media (min-width: 900px) { .detail { grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr); gap: 22px; } }
.sec h4, .tl h4 { font-size: 14.5px; font-weight: 700; color: var(--head); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.sec li { position: relative; padding-left: 14px; margin-bottom: 8px; font-size: 14.5px; }
.sec li::before { content: ""; position: absolute; left: 1px; top: .7em; width: 5px; height: 5px; border-radius: 50%; background: var(--steel2); }
.impl { background: var(--panel2); border-radius: 10px; padding: 12px 14px; margin-top: 14px; }
.impl li:last-child { margin-bottom: 0; }
.mk { width: 24px; height: 24px; border-radius: 50%; background: var(--gold); color: var(--gold-ink); font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; }

/* ---------- timeline ---------- */
.tl { border: 1px solid var(--line); border-radius: 10px; padding: 14px; background: var(--bg); align-self: start; }
.tl h4 small { font-weight: 400; color: var(--muted); font-size: 11.5px; }
.tl h4 { flex-wrap: wrap; row-gap: 0; }
.track { position: relative; padding-left: 48px; }
.track::before { content: ""; position: absolute; left: 17px; top: 16px; bottom: 16px; border-left: 2px dashed var(--steel2); transform-origin: top; transition: transform .9s ease .1s; }
.node { position: relative; padding: 6px 0 6px 4px; min-height: 46px; transition: opacity .4s ease, transform .4s ease; transition-delay: calc(var(--i) * .13s + .15s); }
.node .dot { position: absolute; left: -48px; top: 7px; width: 34px; height: 34px; border-radius: 50%; background: var(--steel); color: #fff; font-family: var(--mono); font-size: 12px;
  display: grid; place-items: center; transition: transform .35s cubic-bezier(.3, 1.5, .5, 1); transition-delay: calc(var(--i) * .13s + .15s); }
.node .d { display: block; font-size: 11.5px; color: var(--muted); font-family: var(--mono); }
.node .t { display: block; font-size: 13.5px; }
.node.cur { background: var(--panel2); border-radius: 8px; padding: 8px 10px; margin-left: -6px; }
.node.cur .dot { background: var(--gold); color: var(--gold-ink); width: 40px; height: 40px; left: -51px; top: 5px; font-weight: 700; }
.node.cur .d { color: var(--steel); font-weight: 500; } .node.cur .t { font-weight: 700; }
.tl.pre .track::before { transform: scaleY(0); }
.tl.pre .node { opacity: 0; transform: translateX(14px); }
.tl.pre .node .dot { transform: scale(0); }
.trend { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 13px; }
.trend b { color: var(--steel); margin-right: 6px; }

/* ---------- closing ---------- */
.close2 { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .close2 { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); } }
.watch { position: relative; padding-left: 26px; }
.watch::before { content: ""; position: absolute; left: 6px; top: 8px; bottom: 8px; border-left: 2px solid var(--steel2); }
.watch li { position: relative; margin-bottom: 14px; font-size: 14px; }
.watch li::before { content: ""; position: absolute; left: -25px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--gold); }
.watch b { display: block; font-family: var(--mono); font-size: 13px; color: var(--head); font-variant-numeric: tabular-nums; }
footer { padding-block: 28px calc(28px + env(safe-area-inset-bottom, 0px)); color: var(--muted); font-size: 12px; text-align: center; }

/* ---------- drawer & fab ---------- */
.drawer { position: fixed; inset: 0; z-index: 40; background: rgba(8, 12, 24, .55); display: flex; justify-content: flex-end; }
.drawer .panel { width: min(420px, 100%); height: 100%; background: var(--panel); overflow-y: auto; overscroll-behavior: contain;
  padding: calc(14px + env(safe-area-inset-top, 0px)) var(--gr) calc(20px + env(safe-area-inset-bottom, 0px)) 16px; animation: slide .25s ease both; }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.drawer .ph { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: 800; font-size: 16px; color: var(--head); }
.drawer .g { margin: 14px 0 4px; font-size: 12.5px; font-weight: 700; color: var(--steel); }
.drawer a { display: flex; gap: 10px; align-items: baseline; padding: 9px 6px; border-radius: 8px; text-decoration: none; font-size: 14px; }
.drawer a:hover { background: var(--panel2); }
.drawer a i { flex: none; width: 2.2em; font-style: normal; font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: right; }
.fab { position: fixed; right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 15; width: 44px; height: 44px; border-radius: 50%;
  border: 0; background: var(--navy2); color: var(--on-navy); font-size: 18px; box-shadow: 0 6px 16px var(--shadow); opacity: 0; pointer-events: none; transition: opacity .25s ease; }
.fab.show { opacity: 1; pointer-events: auto; }
html.lock, html.lock body { overflow: hidden; }

@media (max-width: 420px) { .top .ttl small { display: none; } .art { padding: 14px 12px; } .btn { padding: 0 10px; } }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation: none !important; transition: none !important; } }
@media print { .top, .fab, .more { display: none !important; } .detail[hidden] { display: grid !important; } .art { break-inside: avoid; } }
</style>
</head>
<body>
<header class="top" id="top">
  <div class="wrap">
    <div class="row">
      <span class="no">81</span>
      <div class="ttl">국방 AI 주간 동향 브리핑<small id="issue"></small></div>
      <button class="btn" id="allBtn" type="button" aria-pressed="false">전체 펼치기</button>
      <button class="btn" id="tocBtn" type="button" aria-haspopup="dialog">목차</button>
    </div>
    <nav class="chips" id="chips" aria-label="유형 바로가기"></nav>
  </div>
  <div class="prog" aria-hidden="true"><i id="prog"></i></div>
</header>
<main id="app"></main>
<footer><div class="wrap" id="foot"></div></footer>
<div class="drawer" id="drawer" hidden role="dialog" aria-modal="true" aria-label="목차"><div class="panel" id="panel"></div></div>

<script>

  `<div class="g">마무리</div><a href="#end"><i>—</i>종합 정책 제언 및 주요 일정</a>`;

// ---------- behaviour ----------
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const hdr = $('#top'), setHH = () => document.documentElement.style.setProperty('--hh', (hdr.offsetHeight + 10) + 'px');
setHH(); addEventListener('resize', setHH);

function setOpen(art, open) {
  const b = $('.more', art), d = $('.detail', art);
  b.setAttribute('aria-expanded', open); d.hidden = !open;
  $('.lbl', b).textContent = open ? '접기' : '동향 · 시사점 · 연계 추이 보기';
}
const arts = $$('.art'), allBtn = $('#allBtn');
function syncAll() { const allOpen = arts.every(a => !$('.detail', a).hidden); allBtn.textContent = allOpen ? '전체 접기' : '전체 펼치기'; allBtn.setAttribute('aria-pressed', allOpen); }
arts.forEach(a => $('.more', a).addEventListener('click', () => { setOpen(a, $('.detail', a).hidden); syncAll(); }));
allBtn.addEventListener('click', () => { const open = !arts.every(a => !$('.detail', a).hidden); arts.forEach(a => setOpen(a, open)); syncAll(); });
if (matchMedia('(min-width: 900px)').matches) arts.forEach(a => setOpen(a, true));
syncAll();

// timeline draw-in when visible
if ('IntersectionObserver' in window && !reduce) {
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.remove('pre'); io.unobserve(e.target); } }), { threshold: 0.15 });
  $$('.tl').forEach(t => { t.classList.add('pre'); io.observe(t); });
}

// in-page links: open target article, close drawer
const drawer = $('#drawer');
function closeDrawer() { drawer.hidden = true; document.documentElement.classList.remove('lock'); }
function openDrawer() { drawer.hidden = false; document.documentElement.classList.add('lock'); $('#closeBtn').focus(); }
$('#tocBtn').addEventListener('click', openDrawer);
drawer.addEventListener('click', e => { if (e.target === drawer || e.target.id === 'closeBtn') closeDrawer(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && !drawer.hidden) closeDrawer(); });
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]'); if (!a) return;
  const t = document.getElementById(a.getAttribute('href').slice(1)); if (!t) return;
  e.preventDefault(); closeDrawer();
  if (t.classList.contains('art')) { setOpen(t, true); syncAll(); }
  t.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
  try { history.replaceState(null, '', '#' + t.id); } catch (err) {}
});

// scroll progress, active chip, back-to-top
const prog = $('#prog'), fab = $('#fab'), chips = $('#chips'), chipEls = $$('.chip');
let ticking = false, active = '';
function onScroll() {
  ticking = false;
  const max = document.documentElement.scrollHeight - innerHeight;
  prog.style.width = (max > 0 ? Math.min(100, scrollY / max * 100) : 0) + '%';
  fab.classList.toggle('show', scrollY > 600);
  const line = hdr.offsetHeight + 40; let cur = '';
  for (const s of secs) { const el = document.getElementById(s.id); if (el.getBoundingClientRect().top <= line) cur = s.id; }
  if (cur !== active) {
    active = cur;
    chipEls.forEach(c => c.classList.toggle('on', c.dataset.id === cur));
    const on = chipEls.find(c => c.dataset.id === cur);
    if (on) chips.scrollTo({ left: on.offsetLeft - chips.clientWidth / 2 + on.clientWidth / 2, behavior: reduce ? 'auto' : 'smooth' });
  }
}
addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
onScroll();
fab.addEventListener('click', () => scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }));
if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) { if (t.classList.contains('art')) { setOpen(t, true); syncAll(); } setTimeout(() => t.scrollIntoView(), 50); } }
</script>
</body>
