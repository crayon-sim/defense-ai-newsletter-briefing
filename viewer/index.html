<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>국방 AI 주간 브리핑</title>
<style>
:root{color-scheme:light;--ink:#12283a;--muted:#516575;--line:#c7d4d8;--teal:#096559;--mint:#a9efca;--bg:#f1f5f4;font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
*{box-sizing:border-box}body{margin:0}a{color:inherit}button,select{font:inherit}button,.button,select{min-height:44px;padding:.55rem 1rem;border:1px solid var(--line);background:white;border-radius:5px;color:var(--ink);cursor:pointer}.button{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:var(--mint);color:#0c352c;border-color:transparent;font-weight:750}button:disabled{cursor:default;opacity:.4}a:hover,button:enabled:hover,select:hover{filter:brightness(.94)}:focus-visible{outline:3px solid #de8726;outline-offset:3px}[hidden]{display:none!important}
.mast{border-bottom:1px solid var(--line);background:#fff}.bar,main{width:min(1120px,92vw);margin:auto}.bar{min-height:60px;display:flex;align-items:center;gap:12px;font-weight:750}.brand{display:flex;align-items:center;gap:12px;text-decoration:none}.mark{display:inline-block;width:20px;height:25px;border-left:5px solid var(--teal);border-right:5px solid var(--teal);transform:skew(-14deg);position:relative}.mark:after{content:"";position:absolute;top:6px;left:2px;width:3px;height:19px;background:var(--teal)}.archive-link{margin-left:auto;color:var(--teal);font-size:.88rem;font-weight:500;text-underline-offset:.2em;text-align:right}
main{padding:clamp(18px,4vw,46px) 0}.hero,.sheet.cover{position:relative;isolation:isolate;overflow:hidden;color:white;background:linear-gradient(118deg,#112d37,#12454b 65%,#14615a);border-radius:12px}.hero{padding:clamp(26px,6vw,70px)}.hero:after,.cover:after{pointer-events:none;content:"";position:absolute;inset:0 0 0 40%;z-index:-1;background:repeating-radial-gradient(ellipse at 99% 101%,transparent 0 24px,#b4efd51c 25px 26px,transparent 27px 38px);mask-image:linear-gradient(90deg,transparent,black 35%)}.eyebrow{font-weight:750;font-size:.92rem;color:var(--teal);margin:0 0 1.15rem}.hero .eyebrow,.cover .eyebrow{color:var(--mint)}h1,h2,h3,p{margin-top:0}h1,h2,h3{word-break:keep-all;overflow-wrap:anywhere}.hero h1,.cover h1{font-size:clamp(2rem,5.2vw,4rem);line-height:1.14;letter-spacing:-.055em;max-width:16em;margin-bottom:1rem}.hero .button{margin-top:1rem}.meta{color:var(--muted);line-height:1.65}.hero .meta,.cover .meta{color:#d2e8e3}.shelf{margin-top:clamp(32px,6vw,64px)}.shelf h2{font-size:1.4rem}.entry{display:grid;align-items:center;grid-template-columns:minmax(68px,auto) 1fr auto;gap:20px;padding:20px 0;border-top:1px solid var(--line);text-decoration:none}.entry:last-child{border-bottom:1px solid var(--line)}.entry strong{color:var(--teal)}.entry small{font-size:.92rem;color:var(--muted)}.reader{padding-top:16px}.tools,.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.tools{margin-bottom:12px}.tools select{flex:1;min-width:0;max-width:100%}.sheet{background:#fff;border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:8px;padding:clamp(24px,5vw,64px);min-height:min(59vh,630px);line-height:1.65}.sheet.cover{display:flex;justify-content:center;flex-direction:column;border:0}.sheet h1{font-size:clamp(1.65rem,3.5vw,3rem);letter-spacing:-.045em;line-height:1.25;margin-bottom:1.2rem}.sheet .lead{font-size:clamp(1.13rem,2.2vw,1.55rem);line-height:1.65;max-width:48em}.sheet .cover h1{font-size:3.5rem}.sheet ul{padding-left:1.35em}.sheet li,.pair{margin:.6rem 0}.sheet li::marker{color:var(--teal)}.pair strong{display:block;color:var(--teal)}.sheet details{border-top:1px solid var(--line);margin-top:1.6rem;padding-top:1rem}.sheet summary{cursor:pointer;color:var(--teal);font-weight:700}.sheet details h2{margin:1.3rem 0 .45rem;font-size:1.08rem}.controls{padding:12px 0}.controls .count{margin-right:auto;color:var(--muted);font-variant-numeric:tabular-nums}.progress{height:4px;background:#cad8d6;margin-top:16px}.progress i{display:block;height:100%;background:var(--teal)}.note{font-size:.95rem;color:var(--muted)}body:fullscreen{overflow:auto}
@media(max-width:620px){.entry{grid-template-columns:auto 1fr;gap:4px 12px}.entry small{grid-column:2}.bar{padding:.45rem 0}.bar a{word-break:keep-all}.mark{flex-shrink:0}.tools select{order:3;flex-basis:100%}.hero:after{inset:0 0 0 10%}.sheet{min-height:50vh}.sheet .lead{line-height:1.55}.controls{gap:7px}.controls button{padding:.5rem .8rem}}
</style>
<header class="mast"><div class="bar"><a class="brand" href="#"><i class="mark" aria-hidden="true"></i>국방 AI 주간 브리핑</a><a class="archive-link" href="https://crayon-sim.github.io/defense-ai-newsletter/index.html">국방 AI 뉴스레터 아카이브</a></div></header>
<main id="library"></main>
<main id="reader" class="reader" hidden>
<nav class="tools" aria-label="발표 도구"><a href="#" class="button">호별 목록</a><select id="toc" aria-label="슬라이드 목차"></select><a id="original" class="button" target="_blank" rel="noopener">원본 보기</a></nav>
<article class="sheet" id="sheet" aria-labelledby="slideTitle"></article>
<div class="progress" aria-hidden="true"><i id="meter"></i></div>
<nav class="controls" aria-label="슬라이드 이동"><span class="count" id="count" aria-live="polite"></span><button id="prev">이전</button><button id="next">다음</button><button id="full">전체 화면</button></nav>
</main>
<script type="application/json" id="data">__BRIEFINGS__</script>
<script>
'use strict';
const issues=JSON.parse(document.querySelector('#data').textContent);
const el=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nameOf=d=>d.issue?'제'+d.issue+'호':'브리핑';
const ref=(d,i)=>'#'+new URLSearchParams({issue:d.id,slide:i+1});
const meta=items=>items.filter(Boolean).map(esc).join(' · ');
const list=items=>items?.length?'<ul>'+items.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul>':'';
let active=null, index=0;
function library(){
  const d=issues[0];
  if(!d){el('library').innerHTML='<h1>주간 브리핑</h1><p>등록된 브리핑이 없습니다.</p>';return}
  el('library').innerHTML='<section class="hero"><p class="eyebrow">최신 브리핑 · '+esc(nameOf(d))+'</p><h1>'+esc(d.title)+'</h1><p class="meta">'+meta([d.date,d.scope,d.slides.length+'장'])+'</p><a class="button primary" href="'+esc(ref(d,0))+'">슬라이드 보기</a></section><section class="shelf"><h2>호별 브리핑</h2>'+issues.map(v=>'<a class="entry" href="'+esc(ref(v,0))+'"><strong>'+esc(nameOf(v))+'</strong><span>'+esc(v.title)+'</span><small>'+meta([v.date,v.slides.length+'장'])+'</small></a>').join('')+'</section>';
}
function route(){
  const p=new URLSearchParams(location.hash.slice(1));
  const d=issues.find(v=>v.id===p.get('issue'));
  el('reader').hidden=!d;el('library').hidden=!!d;
  if(!d){active=null;document.title='국방 AI 주간 브리핑';return}
  if(active!==d){
    el('toc').replaceChildren(...d.slides.map((s,i)=>new Option((i+1)+'. '+s.title,i)));
    el('original').href=d.file;
  }
  active=d;index=Math.max(0,Math.min(d.slides.length-1,(Number.parseInt(p.get('slide'),10)||1)-1));
  const s=d.slides[index], sheet=el('sheet');
  sheet.className='sheet '+s.kind;
  const pairs=(s.pairs||[]).map(([k,v])=>'<p class="pair"><strong>'+esc(k)+'</strong>'+esc(v)+'</p>').join('');
  const details=(s.detail||[]).filter(([,lines])=>lines.length).map(([k,lines])=>'<h2>'+esc(k)+'</h2>'+list(lines)).join('');
  sheet.innerHTML='<p class="eyebrow">'+meta([nameOf(d),s.label,s.article?'기사 '+s.article:''])+'</p><h1 id="slideTitle">'+esc(s.title)+'</h1>'+(s.lead?'<p class="lead">'+esc(s.lead)+'</p>':'')+list(s.lines)+pairs+(s.note?'<p class="meta">'+esc(s.kind==='article'?'출처 · '+s.note:s.note)+'</p>':'')+(s.kind==='cover'&&d.author?'<p class="meta">'+esc(d.author)+'</p>':'')+(details?'<details><summary>기사 상세 보기</summary>'+details+'</details>':'');
  el('count').textContent=(index+1)+' / '+d.slides.length+'장';
  el('meter').style.width=(index+1)*100/d.slides.length+'%';
  el('prev').disabled=index===0;el('next').disabled=index===d.slides.length-1;
  el('toc').value=index;document.title=s.title+' · '+nameOf(d);
  window.scrollTo(0,0);
}
function go(i){
  if(!active||i<0||i>=active.slides.length)return;
  // Replace slide changes so Back returns to the archive in one step.
  location.replace(ref(active,i));
}
el('toc').onchange=e=>go(Number(e.target.value));
el('prev').onclick=()=>go(index-1);el('next').onclick=()=>go(index+1);
document.addEventListener('keydown',e=>{
  if(!active||e.altKey||e.ctrlKey||e.metaKey||e.target.closest('select,input,textarea'))return;
  const targets={ArrowLeft:index-1,ArrowRight:index+1,Home:0,End:active.slides.length-1};
  if(Object.hasOwn(targets,e.key)){e.preventDefault();go(targets[e.key])}
});
el('full').hidden=!document.fullscreenEnabled;
el('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{el('full').hidden=true}};
document.addEventListener('fullscreenchange',()=>el('full').textContent=document.fullscreenElement?'전체 화면 종료':'전체 화면');
window.addEventListener('hashchange',route);library();route();
</script></html>
